{% extends 'layout.html' %}

{% block title %}
{% if trek %}Edit Trek{% else %}Add New Trek{% endif %} | Trekking Management
{% endblock %}

{% block content %}

<h2 class="mb-4">
    {% if trek %}Edit Trek{% else %}Add New Trek{% endif %}
</h2>

<div class="card shadow-sm">
    <div class="card-body">

        <form method="POST"
              action="{% if trek %}{{ url_for('edit_trek', trek_id=trek.trekid) }}{% else %}{{ url_for('add_trek') }}{% endif %}">

            <div class="row">

                <!-- Left Column -->
                <div class="col-md-6">

                    <div class="mb-3">
                        <label class="form-label">Trek Name</label>
                        <input type="text"
                               class="form-control"
                               name="trekname"
                               value="{{ trek.trekname if trek else '' }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Location</label>
                        <input type="text"
                               class="form-control"
                               name="location"
                               value="{{ trek.location if trek else '' }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Difficulty</label>
                        <select class="form-select" name="difficulty" required>
                            <option value="">Select Difficulty</option>
                            <option value="Easy" {% if trek and trek.difficulty=="Easy" %}selected{% endif %}>Easy</option>
                            <option value="Moderate" {% if trek and trek.difficulty=="Moderate" %}selected{% endif %}>Moderate</option>
                            <option value="Hard" {% if trek and trek.difficulty=="Hard" %}selected{% endif %}>Hard</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Duration (Days)</label>
                        <input type="number"
                               class="form-control"
                               name="duration"
                               min="1"
                               value="{{ trek.duration if trek else '' }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Total Slots</label>
                        <input type="number"
                               class="form-control"
                               name="slots"
                               min="1"
                               value="{{ trek.total_slots if trek else '' }}"
                               required>
                    </div>

                </div>

                <!-- Right Column -->
                <div class="col-md-6">

                    <div class="mb-3">
                        <label class="form-label">Start Date</label>
                        <input type="date"
                               class="form-control"
                               name="start_date"
                               value="{{ trek.start_date.strftime('%Y-%m-%d') if trek else '' }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">End Date</label>
                        <input type="date"
                               class="form-control"
                               name="end_date"
                               value="{{ trek.end_date.strftime('%Y-%m-%d') if trek else '' }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Assign Staff</label>
                        <select class="form-select" name="staff_id" required>
                            <option value="">Select Staff</option>
                            {% for s in staff_list %}
                            <option value="{{ s.id }}"
                                {% if trek and trek.assigned_staff==s.id %}selected{% endif %}>
                                {{ s.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select class="form-select" name="status" required>
                            <option value="">Select Status</option>
                            <option value="Open" {% if trek and trek.status=="Open" %}selected{% endif %}>Open</option>
                            <option value="Closed" {% if trek and trek.status=="Closed" %}selected{% endif %}>Closed</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control"
                                  name="description"
                                  rows="4">{{ trek.description if trek else '' }}</textarea>
                    </div>

                </div>

            </div>

            <div class="text-end mt-4">
                <a href="{{ url_for('admin_treks') }}" class="btn btn-secondary">
                    Cancel
                </a>

                <button class="btn btn-primary" type="submit">
                    {% if trek %}Save Changes{% else %}Save Trek{% endif %}
                </button>
            </div>

        </form>

    </div>
</div>

{% endblock %}
