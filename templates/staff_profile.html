{% extends 'staff_layout.html' %}

{% block title %}My Profile | Trekking Management{% endblock %}

{% block content %}

<h2 class="mb-4">My Profile</h2>

<div class="card shadow-sm">
    <div class="card-body">

        <form action="{{ url_for('staff_profile') }}" method="POST">

            <div class="row">

                <div class="col-md-6">

                    <div class="mb-3">
                        <label class="form-label">Staff ID</label>
                        <input
                            type="text"
                            class="form-control"
                            value="{{ staff.staffid }}"
                            readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input
                            type="text"
                            class="form-control"
                            name="name"
                            value="{{ user.name }}"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input
                            type="email"
                            class="form-control"
                            value="{{ user.email }}"
                            readonly>
                    </div>

                </div>

                <div class="col-md-6">

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input
                            type="text"
                            class="form-control"
                            name="phone"
                            value="{{ user.phone }}"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Approval Status</label>
                        <input
                            type="text"
                            class="form-control"
                            value="{{ staff.approval_status }}"
                            readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Assigned Treks</label>
                        <input
                            type="text"
                            class="form-control"
                            value="{{ assigned_trek_count }}"
                            readonly>
                    </div>

                </div>

            </div>

            <div class="text-end mt-3">
                <button type="submit" class="btn btn-primary">
                    Save Changes
                </button>
            </div>

        </form>

    </div>
</div>

{% endblock %}
