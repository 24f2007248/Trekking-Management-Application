<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Trekking Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Days+One&display=swap" rel="stylesheet">
</head>

<body class="min-vh-100 d-flex justify-content-center align-items-center">

<div class="login-box p-5 text-center rounded-4">
    
    <h1 class="display-4 text-white mb-4">Login</h1>

    {% if error %}
        <p class="text-danger small fw-bold mb-3">
            {{ error }}
        </p>
    {% endif %}

    <form method="POST">
        <div class="mb-3">
            <input 
                type="email"
                name="email"
                class="form-control"
                placeholder="Email"
                required>
        </div>

        <div class="mb-4">
            <input 
                type="password"
                name="password"
                class="form-control"
                placeholder="Password"
                required>
        </div>

        <button type="submit" class="btn btn-light w-100 py-2 fw-bold shadow-sm">
            Login
        </button>
    </form>
    
    <p class="mt-4 text-white small mb-0">
        Don't have an account?
        <a href="{{ url_for('register') }}" class="custom-link text-decoration-none">Register here</a>
    </p>
</div>

</body>
</html>
