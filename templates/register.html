<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Trekking Management</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='register.css') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Days+One&display=swap" rel="stylesheet">
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

<div class="register-container">
    <h1 class="mb-4">Register</h1>

    {% if error %}
        <p class="text-danger small fw-bold mb-3">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <input type="text" name="name" class="form-control mb-3" placeholder="Full Name" required>
        <input type="email" name="email" class="form-control mb-3" placeholder="Email" required>
        <input type="text" name="phone" class="form-control mb-3" placeholder="Phone Number" required>
        <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>
        <input type="password" name="confirm_password" class="form-control mb-4" placeholder="Confirm Password" required>

        <div class="role-box mb-4">
            <label class="me-2">I am a</label>
            <select name="role" class="form-select d-inline-block w-auto" required>
                <option value="">-- Select Role --</option>
                <option value="user">User</option>
                <option value="staff">Staff</option>
            </select>
        </div>

        <button type="submit" class="btn btn-light w-100 py-2 fw-bold">Register</button>
    </form>

    <p class="login-link mt-4 mb-0">
        Already have an account? <a href="{{ url_for('login') }}">Login here</a>
    </p>
</div>

</body>
</html>
