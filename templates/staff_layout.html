<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Dashboard | Trekking Management{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Days+One&display=swap" rel="stylesheet">
</head>
<body class="min-vh-100 d-flex flex-column">

    <header class="navbar navbar-dark sticky-top bg-dark-transparent px-4 py-3">
        <a class="navbar-brand fs-5" href="{{ url_for('staff_dashboard') }}">Trekking Management Application</a>
        <div class="text-white d-flex align-items-center gap-2">
            <i class="bi bi-person-circle fs-5"></i> <span>{{ session.get('name', 'Staff Member') }}</span>
        </div>
    </header>

    <div class="container-fluid flex-grow-1 d-flex p-0">
        <nav class="sidebar py-4 px-3 d-flex flex-column justify-content-between">
            <ul class="bg-white border rounded-3 nav nav-pills flex-column gap-2">
                <li class="nav-item">
                    <a href="{{ url_for('staff_dashboard') }}" class="nav-link {% if active_page == 'dashboard' %}active{% endif %} d-flex align-items-center gap-3">
                        <i class="bi bi-house-door-fill"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('staff_treks') }}" class="nav-link {% if active_page == 'treks' %}active{% endif %} d-flex align-items-center gap-3">
                        <i class="bi bi-tree-fill"></i> My Treks
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('staff_participants') }}" class="nav-link {% if active_page == 'participants' %}active{% endif %} d-flex align-items-center gap-3">
                        <i class="bi bi-people-fill"></i> Participants
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('staff_profile') }}" class="nav-link {% if active_page == 'users' %}active{% endif %} d-flex align-items-center gap-3">
                        <i class="bi bi-person-fill"></i> Profile
                    </a>
                </li>
                <li class="nav-item border-top border-secondary pt-3">
                    <a href="{{ url_for('logout') }}" class="nav-link d-flex align-items-center gap-3">
                        <i class="bi bi-box-arrow-left"></i> Logout
                    </a>
                </li>
            </ul>
        </nav>

        <main class="main-content flex-grow-1 p-4 p-md-5 overflow-auto">
            {% block content %}
            {% endblock %}
        </main>
    </div>
</body>
</html>
